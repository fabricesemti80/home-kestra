---
# All hosts in the homelab share the same SSH key.
home:
  vars:
    ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/fs_home_rsa"
  children:
    proxmox:
      vars:
        ansible_user: root
      hosts:
        proxmox-pve-0:
          ansible_host: 10.0.40.10
        proxmox-pve-1:
          ansible_host: 10.0.40.11
        proxmox-pve-2:
          ansible_host: 10.0.40.12
        proxmox-pbs-0:
          ansible_host: 10.0.40.16
    servers:
      vars:
        ansible_user: fs
      hosts:
        coolify:
          ansible_host: 10.0.30.51
        hermes:
          ansible_host: 10.0.30.50

# Every host gets the Pulse agent. The playbook uses `become: true`, so
# hosts connecting as a non-root user (coolify, hermes) escalate via sudo.
pulse_agents:
  children:
    home:
