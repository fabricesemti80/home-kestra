id: stack_maintenance
namespace: homelab.ops
description: Routine Proxmox host maintenance. Simulates and pins safe package upgrades (no removals, no major version changes), gracefully stops all guests, sets Ceph noout, upgrades packages, reboots each host with quorum/boot verification, then restores Ceph, guests, onboot flags, and schedulers. Keeps a journaled state on every host and supports a recovery mode after operator failure. The infra-cluster (running Kestra) is not part of the stack and stays up. Dry-run (inspection only) by default; a live run requires the exact confirmation phrase plus backup and external-client acknowledgements.

inputs:
  - id: live
    type: BOOL
    defaults: false
    description: Perform the maintenance for real. False = read-only inspection.
  - id: recovery
    type: BOOL
    defaults: false
    description: Resume a previously interrupted operation from the host journals. Never repeats shutdown, package, or reboot steps.
  - id: confirmation
    type: STRING
    defaults: ""
    description: Required for live runs, exactly 'FULL OUTAGE pve-0 pve-1 pve-2'.
  - id: backup_checked
    type: BOOL
    defaults: false
    description: Confirm a current PBS backup exists for all affected guests.
  - id: external_ceph_clients_checked
    type: BOOL
    defaults: false
    description: Confirm Ceph clients outside this inventory (e.g. Kubernetes CSI) are stopped or acceptable to disrupt.

tasks:
  - id: maintain
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: python:3.12-alpine
    beforeCommands:
      - apk add --no-cache openssh-client
    namespaceFiles:
      enabled: true
      include:
        - maintenance.py
        - maintenance_host.py
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      HOMELAB_SSH_PRIVATE_KEY: "{{ secret('HOMELAB_SSH_PRIVATE_KEY') }}"
      HOMELAB_SSH_KNOWN_HOSTS: "{{ secret('HOMELAB_SSH_KNOWN_HOSTS') }}"
      MAINTENANCE_CONFIRMATION: "{{ inputs.confirmation }}"
      MAINTENANCE_BACKUP_ACK: "{{ inputs.backup_checked }}"
      MAINTENANCE_CLIENT_AUDIT_ACK: "{{ inputs.external_ceph_clients_checked }}"
    outputFiles:
      - maintenance-state.json
    commands:
      - |
        args=""
        if [ "{{ inputs.live }}" = "true" ]; then args="$args --live"; fi
        if [ "{{ inputs.recovery }}" = "true" ]; then args="$args --mode recover"; fi
        # Intentional word splitting: args is built from fixed booleans only.
        python3 maintenance.py $args
