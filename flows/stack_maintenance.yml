      MAINTENANCE_BACKUP_ACK: "{{ inputs.backup_checked }}"
      MAINTENANCE_CLIENT_AUDIT_ACK: "{{ inputs.external_ceph_clients_checked }}"
    outputFiles:
      - maintenance-state.json
    commands:
      - python3 maintenance.py --stage reboot --host pve-1 --live

  - id: reboot_pve_2
    type: io.kestra.plugin.scripts.shell.Commands
    runIf: "{{ inputs.live }}"
    containerImage: python:3.12-alpine
    beforeCommands:
      - apk add --no-cache openssh-client
    namespaceFiles:
      enabled: true
      include:
        - maintenance.py
        - maintenance_host.py
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      HOMELAB_SSH_PRIVATE_KEY: "{{ secret('HOMELAB_SSH_PRIVATE_KEY') }}"
      HOMELAB_SSH_KNOWN_HOSTS: "{{ secret('HOMELAB_SSH_KNOWN_HOSTS') }}"
      MAINTENANCE_CONFIRMATION: "{{ inputs.confirmation }}"
      MAINTENANCE_BACKUP_ACK: "{{ inputs.backup_checked }}"
