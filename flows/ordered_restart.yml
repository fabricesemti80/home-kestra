id: ordered_restart
namespace: homelab.ops
description: Ordered homelab restart after recabling.

inputs:
  - id: dry_run
    type: BOOL
    defaults: true
  - id: wait_minutes
    type: INT
    defaults: 20

tasks:
  - id: wait_for_proxmox_hosts
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: alpine:3.20
    beforeCommands:
      - apk add --no-cache bash openssh-client
    namespaceFiles:
      enabled: true
      include:
        - ordered-restart.sh
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      HOMELAB_SSH_PRIVATE_KEY: "{{ secret('HOMELAB_SSH_PRIVATE_KEY') }}"
      HOMELAB_SSH_KNOWN_HOSTS: "{{ secret('HOMELAB_SSH_KNOWN_HOSTS') }}"
    commands:
      - bash ordered-restart.sh "{{ inputs.dry_run }}" "{{ inputs.wait_minutes }}" wait_hosts

  - id: wait_for_ceph_health
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: alpine:3.20
    beforeCommands:
      - apk add --no-cache bash openssh-client
    namespaceFiles:
      enabled: true
      include:
        - ordered-restart.sh
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      HOMELAB_SSH_PRIVATE_KEY: "{{ secret('HOMELAB_SSH_PRIVATE_KEY') }}"
      HOMELAB_SSH_KNOWN_HOSTS: "{{ secret('HOMELAB_SSH_KNOWN_HOSTS') }}"
    commands:
      - bash ordered-restart.sh "{{ inputs.dry_run }}" "{{ inputs.wait_minutes }}" wait_ceph

  - id: clear_ceph_maintenance
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: alpine:3.20
    beforeCommands:
      - apk add --no-cache bash openssh-client
    namespaceFiles:
      enabled: true
      include:
        - ordered-restart.sh
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      HOMELAB_SSH_PRIVATE_KEY: "{{ secret('HOMELAB_SSH_PRIVATE_KEY') }}"
      HOMELAB_SSH_KNOWN_HOSTS: "{{ secret('HOMELAB_SSH_KNOWN_HOSTS') }}"
    commands:
      - bash ordered-restart.sh "{{ inputs.dry_run }}" "{{ inputs.wait_minutes }}" clear_ceph_maintenance

  - id: start_service_guests
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: alpine:3.20
    beforeCommands:
      - apk add --no-cache bash openssh-client
    namespaceFiles:
      enabled: true
      include:
        - ordered-restart.sh
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      HOMELAB_SSH_PRIVATE_KEY: "{{ secret('HOMELAB_SSH_PRIVATE_KEY') }}"
      HOMELAB_SSH_KNOWN_HOSTS: "{{ secret('HOMELAB_SSH_KNOWN_HOSTS') }}"
    commands:
      - bash ordered-restart.sh "{{ inputs.dry_run }}" "{{ inputs.wait_minutes }}" start_services

  - id: start_kubernetes_vms
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: alpine:3.20
    beforeCommands:
      - apk add --no-cache bash openssh-client
    namespaceFiles:
      enabled: true
      include:
        - ordered-restart.sh
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      HOMELAB_SSH_PRIVATE_KEY: "{{ secret('HOMELAB_SSH_PRIVATE_KEY') }}"
      HOMELAB_SSH_KNOWN_HOSTS: "{{ secret('HOMELAB_SSH_KNOWN_HOSTS') }}"
    commands:
      - bash ordered-restart.sh "{{ inputs.dry_run }}" "{{ inputs.wait_minutes }}" start_k8s
