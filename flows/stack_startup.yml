id: stack_startup
namespace: homelab.ops
description: Ordered full-stack startup after manual Proxmox host power-on. Waits for all three hosts, starts Ceph and clears maintenance flags, then starts the PBS LXC, service VMs, and app-cluster VMs. Kubernetes readiness is not verified; check the app-cluster separately after the run. Dry-run by default.

inputs:
  - id: dry_run
    type: BOOL
    defaults: true
  - id: wait_minutes
    type: INT
    defaults: 20

tasks:
  - id: wait_for_hosts
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: alpine:3.20
    beforeCommands:
      - apk add --no-cache bash openssh-client
    namespaceFiles:
      enabled: true
      include:
        - stack-startup.sh
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      HOMELAB_SSH_PRIVATE_KEY: "{{ secret('HOMELAB_SSH_PRIVATE_KEY') }}"
      HOMELAB_SSH_KNOWN_HOSTS: "{{ secret('HOMELAB_SSH_KNOWN_HOSTS') }}"
    commands:
      - bash stack-startup.sh "{{ inputs.dry_run }}" "{{ inputs.wait_minutes }}" wait_hosts

  - id: wait_for_ceph
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: alpine:3.20
    beforeCommands:
      - apk add --no-cache bash openssh-client
    namespaceFiles:
      enabled: true
      include:
        - stack-startup.sh
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      HOMELAB_SSH_PRIVATE_KEY: "{{ secret('HOMELAB_SSH_PRIVATE_KEY') }}"
      HOMELAB_SSH_KNOWN_HOSTS: "{{ secret('HOMELAB_SSH_KNOWN_HOSTS') }}"
    commands:
      - bash stack-startup.sh "{{ inputs.dry_run }}" "{{ inputs.wait_minutes }}" wait_ceph

  - id: start_infra_guests
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: alpine:3.20
    beforeCommands:
      - apk add --no-cache bash openssh-client
    namespaceFiles:
      enabled: true
      include:
        - stack-startup.sh
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      HOMELAB_SSH_PRIVATE_KEY: "{{ secret('HOMELAB_SSH_PRIVATE_KEY') }}"
      HOMELAB_SSH_KNOWN_HOSTS: "{{ secret('HOMELAB_SSH_KNOWN_HOSTS') }}"
    commands:
      - bash stack-startup.sh "{{ inputs.dry_run }}" "{{ inputs.wait_minutes }}" start_infra

  - id: start_service_guests
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: alpine:3.20
    beforeCommands:
      - apk add --no-cache bash openssh-client
    namespaceFiles:
      enabled: true
      include:
        - stack-startup.sh
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      HOMELAB_SSH_PRIVATE_KEY: "{{ secret('HOMELAB_SSH_PRIVATE_KEY') }}"
      HOMELAB_SSH_KNOWN_HOSTS: "{{ secret('HOMELAB_SSH_KNOWN_HOSTS') }}"
    commands:
      - bash stack-startup.sh "{{ inputs.dry_run }}" "{{ inputs.wait_minutes }}" start_services

  - id: start_kubernetes_vms
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: alpine:3.20
    beforeCommands:
      - apk add --no-cache bash openssh-client
    namespaceFiles:
      enabled: true
      include:
        - stack-startup.sh
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      HOMELAB_SSH_PRIVATE_KEY: "{{ secret('HOMELAB_SSH_PRIVATE_KEY') }}"
      HOMELAB_SSH_KNOWN_HOSTS: "{{ secret('HOMELAB_SSH_KNOWN_HOSTS') }}"
    commands:
      - bash stack-startup.sh "{{ inputs.dry_run }}" "{{ inputs.wait_minutes }}" start_k8s
